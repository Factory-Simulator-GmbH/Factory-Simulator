services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: factory-simulator
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: factory-simulator-prod
    ports:
      - "8080:80"
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: factory-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data:
